name: "CodeQL Advanced"

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    - cron: '39 19 * * 1'

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest

    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
          - language: c-cpp
            build-mode: manual
          - language: javascript-typescript
            build-mode: none
          - language: python
            build-mode: none

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    # ------------------------------
    # Initialize CodeQL
    # ------------------------------
    - name: Initialize CodeQL
      uses: github/codeql-action/init@v4
      with:
        languages: ${{ matrix.language }}
        build-mode: ${{ matrix.build-mode }}

    # ------------------------------
    # Manual V8 build (C/C++)
    # ------------------------------
    - name: Install build dependencies
      if: matrix.language == 'c-cpp'
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          git \
          python3 \
          clang \
          ninja-build \
          lsb-release \
          pkg-config

    - name: Setup depot_tools
      if: matrix.language == 'c-cpp'
      run: |
        git clone https://chromium.googlesource.com/chromium/tools/depot_tools.git
        echo "$PWD/depot_tools" >> $GITHUB_PATH

    - name: Configure gclient
      if: matrix.language == 'c-cpp'
      run: |
        gclient config --name v8 --unmanaged https://chromium.googlesource.com/v8/v8.git

    - name: Sync V8 dependencies
      if: matrix.language == 'c-cpp'
      run: |
        gclient sync --no-history --with_branch_heads=false --with_tags=false

    - name: Configure V8 (GN)
      if: matrix.language == 'c-cpp'
      run: |
        gn gen out/codeql \
          --args='
            is_debug=false
            use_custom_libcxx=false
            v8_enable_i18n_support=false
          '

    - name: Build V8 (Ninja)
      if: matrix.language == 'c-cpp'
      run: |
        ninja -C out/codeql v8_monolith

    # ------------------------------
    # Analyze
    # ------------------------------
    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@v4
      with:
        category: "/language:${{ matrix.language }}"
        
