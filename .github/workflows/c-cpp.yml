name: "CodeQL Advanced (C/C++)"

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  analyze:
    name: Analyze (c-cpp)
    runs-on: ubuntu-latest

    permissions:
      security-events: write
      contents: read

    steps:
    # ------------------------------
    # Checkout
    # ------------------------------
    - name: Checkout repository
      uses: actions/checkout@v4

    # ------------------------------
    # Initialize CodeQL
    # ------------------------------
    - name: Initialize CodeQL
      uses: github/codeql-action/init@v4
      with:
        languages: c-cpp
        build-mode: manual

    # ------------------------------
    # System dependencies (FIX HERE)
    # ------------------------------
    - name: Install build dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          git \
          python3 \
          clang \
          ninja-build \
          lsb-release \
          pkg-config \
          build-essential \
          libglib2.0-dev

    - name: Setup depot_tools
      run: |
        git clone https://chromium.googlesource.com/chromium/tools/depot_tools.git
        echo "$PWD/depot_tools" >> $GITHUB_PATH

    # ------------------------------
    # gclient
    # ------------------------------
    - name: Configure gclient (local checkout)
      run: |
        gclient config --unmanaged .

    - name: Sync V8 dependencies
      run: |
        gclient sync --no-history

    # ------------------------------
    # GN configuration (stable)
    # ------------------------------
    - name: Configure V8 (GN)
      run: |
        gn gen out/codeql \
          --args='
            is_debug=false
            use_custom_libcxx=false
            use_libcxx_modules=false
            use_sysroot=false
            v8_enable_i18n_support=false
          '

    # ------------------------------
    # Build
    - name: Install build dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          git \
          python3 \
          clang \
          ninja-build \
          lsb-release \
          pkg-config \
          build-essential

    - name: Setup depot_tools
      run: |
        git clone https://chromium.googlesource.com/chromium/tools/depot_tools.git
        echo "$PWD/depot_tools" >> $GITHUB_PATH

    # ------------------------------
    # gclient
    # ------------------------------
    - name: Configure gclient (local checkout)
      run: |
        gclient config --unmanaged .

    - name: Sync V8 dependencies
      run: |
        gclient sync --no-history

    # ------------------------------
    # GN + Ninja (FIXED ARGS)
    # ------------------------------
    - name: Configure V8 (GN)
      run: |
        gn gen out/codeql \
          --args='
            is_debug=false
            use_custom_libcxx=false
            use_libcxx_modules=false
            use_sysroot=false
            v8_enable_i18n_support=false
          '

    - name: Build V8 (Ninja)
      run: |
        ninja -C out/codeql v8

    # ------------------------------
    # Analyze
    # ------------------------------
    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@v4
    - name: Install build dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          git \
          python3 \
          clang \
          ninja-build \
          lsb-release \
          pkg-config

    - name: Setup depot_tools
      run: |
        git clone https://chromium.googlesource.com/chromium/tools/depot_tools.git
        echo "$PWD/depot_tools" >> $GITHUB_PATH

    # ------------------------------
    # gclient
    # ------------------------------
    - name: Configure gclient (local checkout)
      run: |
        gclient config --unmanaged .

    - name: Sync V8 dependencies
      run: |
        gclient sync --no-history

    # ------------------------------
    # GN + Ninja
    # ------------------------------
    - name: Configure V8 (GN)
      run: |
        gn gen out/codeql \
          --args='
            is_debug=false
            use_custom_libcxx=false
            v8_enable_i18n_support=false
          '

    - name: Build V8 (Ninja)
      run: |
        ninja -C out/codeql v8

    # ------------------------------
    # Analyze
    # ------------------------------
    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@v4
    - name: Checkout repository
      uses: actions/checkout@v4

    # ------------------------------
    # Initialize CodeQL
    # ------------------------------
    - name: Initialize CodeQL
      uses: github/codeql-action/init@v4
      with:
        languages: ${{ matrix.language }}
        build-mode: ${{ matrix.build-mode }}

    # ==================================================
    # Manual V8 build (ONLY for c-cpp)
    # ==================================================
    - name: Install build dependencies
      if: matrix.language == 'c-cpp'
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          git \
          python3 \
          clang \
          ninja-build \
          lsb-release \
          pkg-config

    - name: Setup depot_tools
      if: matrix.language == 'c-cpp'
      run: |
        git clone https://chromium.googlesource.com/chromium/tools/depot_tools.git
        echo "$PWD/depot_tools" >> $GITHUB_PATH

    # 🔑 Correct gclient config for a V8 fork
    - name: Configure gclient (local checkout)
      if: matrix.language == 'c-cpp'
      run: |
        gclient config --unmanaged .

    - name: Sync V8 dependencies
      if: matrix.language == 'c-cpp'
      run: |
        gclient sync --no-history

    - name: Configure V8 (GN)
      if: matrix.language == 'c-cpp'
      run: |
        gn gen out/codeql \
          --args='
            is_debug=false
            use_custom_libcxx=false
            v8_enable_i18n_support=false
          '

    - name: Build V8 (Ninja)
      if: matrix.language == 'c-cpp'
      run: |
        ninja -C out/codeql v8_monolith

    # ------------------------------
    # Analyze
    # ------------------------------
    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@v4
      with:
        category: "/language:${{ matrix.language }}"
